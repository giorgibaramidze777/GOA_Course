<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- https://api.escuelajs.co/api/v1/products/

საიტზეე დაამატეეთ ერთი input და ერთი submit ღილაკი, შემდეგ მაგ ინფუთში მომხარებელმა უნდა ჩაწეროს რაიმე პროდუქტის title, და დაsubmit ებაზეე უნდა გამოიტანოთ ეგ კონკრეტული ინფორმაცია მაგ პროდუქტზე -->
    <form action="">
    <input type="text" id="productTitle" placeholder="Enter product title">
    <input type="submit" value="Search" id="searchButton">
    </form>
    <script>
        let searchButton = document.getElementById('searchButton')
        let productTitleInput = document.getElementById('productTitle')
        let resultDiv = document.createElement('div')
        resultDiv.id = 'result'
        document.body.appendChild(resultDiv)

        searchButton.addEventListener('click', function(event) {
            event.preventDefault()

            let productTitle = productTitleInput.value.trim()
            if (!productTitle) {
                resultDiv.textContent = 'Please enter a product title.'
                return
            }

            fetch('https://api.escuelajs.co/api/v1/products/')
                .then(response => response.json())
                .then(data => {
                    let product = data.find(item => item.title.toLowerCase() === productTitle.toLowerCase())
                    if (product) {
                        resultDiv.innerHTML = `
                            <h2>${product.title}</h2>
                            <p>Price: $${product.price}</p>
                            <p>${product.description}</p>
                            <img src="${product.images[0] || ''}" alt="${product.title}" width="150">
                        `
                    } else {
                        resultDiv.textContent = 'Product not found'
                    }
                })
                .catch(error => {
                    resultDiv.textContent = 'Error fetching products.'
                    console.error('Error fetching products:', error)
                })
        })
    </script>
</body>
</html>
