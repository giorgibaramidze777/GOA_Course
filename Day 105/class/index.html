<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=add_shopping_cart" />
    <style>
        body {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 100vh;
            background-color: cornflowerblue;
        }
        #div1, #div2, #div3 {
            width: 230px;
            height: 560px;
            background-color: black;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 3px;
            text-align: center;
        }

        #parent {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 80%;
            gap: 10px;
        }
        #cart {
            width: 400px;
            height: 300px;
            background-color: black;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-y: scroll;
        }

        button {
            border: none;
            background-color: white;
            color: black;
            padding: 10px;
            font-size: 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        img {
            width: 150px;
            height: 300px;
        }

    </style>
</head>
<body>
    <div id="parent">
        <div id="div1">
        <img src="./image-removebg-preview (6).png" alt="iPhone 17 pro max">
        <h1 id="h1">iPhone 17 pro max</h1>
        <p id="p1">3799$</p>
        <button id="b1"><span class="material-symbols-outlined">add_shopping_cart</span></button>
    </div>
    <div id="div2">
        <img src="./image-removebg-preview (5).png" alt="iPhone 16 pro max">
        <h1 id="h2">iPhone 16 pro max</h1>
        <p id="p2">2999$</p>
        <button id="b2"><span class="material-symbols-outlined">add_shopping_cart</span></button>
    </div>
    <div id="div3">
        <img src="./image-removebg-preview (7).png" alt="iPhone 15 pro max">
        <h1 id="h3">iPhone 15 pro max</h1>
        <p id="p3">1999$</p>
        <button id="b3"><span class="material-symbols-outlined">add_shopping_cart</span></button>
    </div>
    </div>

    <div id="cart">
        <h1>Cart</h1>
    </div>
    <script>
        let b1 = document.getElementById("b1")
        let b2 = document.getElementById("b2")
        let b3 = document.getElementById("b3")
        let cart = document.getElementById("cart")

        function addToCart(headingId, priceId, buttonId) {
            let heading = document.getElementById(headingId).textContent
            let price = document.getElementById(priceId).textContent
            let div = document.createElement("div")
            div.style.display = "flex"
            div.style.justifyContent = "space-between"
            div.style.alignItems = "center"
            div.style.width = "90%"
            div.style.marginTop = "10px"
            div.style.padding = "5px"
            div.style.borderBottom = "1px solid white"
            
            let removeBtn = document.createElement("button")
            removeBtn.textContent = "-"
            removeBtn.style.padding = "5px 10px"
            removeBtn.style.fontSize = "10px"
            removeBtn.addEventListener("click", () => {
            div.remove()
            updateTotal()
            })
            
            div.innerHTML = `<p>${heading}</p><p>${price}</p>`
            div.appendChild(removeBtn)
            cart.appendChild(div)
            updateTotal()
        }

        function updateTotal() {
            let total = 0
            let items = cart.querySelectorAll("div")
            items.forEach(item => {
            let price = item.querySelector("p:nth-child(2)")
            if (price) {
                total += parseInt(price.textContent)
            }
            })
            let totalDiv = document.getElementById("totalDiv")
            if (!totalDiv) {
            totalDiv = document.createElement("div")
            totalDiv.id = "totalDiv"
            totalDiv.style.marginTop = "20px"
            totalDiv.style.fontSize = "18px"
            totalDiv.style.fontWeight = "bold"
            cart.appendChild(totalDiv)
            }
            totalDiv.textContent = `Total: ${total}$`
        }

        document.getElementById("b1").addEventListener("click", () => addToCart("h1", "p1", "b1"))
        document.getElementById("b2").addEventListener("click", () => addToCart("h2", "p2", "b2"))
        document.getElementById("b3").addEventListener("click", () => addToCart("h3", "p3", "b3"))
    </script>
</body>
</html>
